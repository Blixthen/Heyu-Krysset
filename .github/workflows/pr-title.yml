name: PR title

on:
  pull_request:
    # `edited` reruns the check when only the title changes.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title follows Conventional Commits
        # Passed through env, not interpolated into the script, because the
        # title is user input.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|ci|docs|test|refactor)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(sync): keep letters on reconnect'. Allowed types: feat, fix, chore, ci, docs, test, refactor. Got: $TITLE"
            exit 1
          fi
